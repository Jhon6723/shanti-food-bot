services:
  db:
    image: postgres:16-alpine
    container_name: shanti-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # PostgreSQL port exposed for local dev (app runs outside Docker)
    #ports:
      # - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: shanti-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database (overrides .env localhost for Docker networking)
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # WhatsApp Provider (meta | openwa)
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      # Meta Cloud API
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v18.0}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      # OpenWA Gateway
      WHATSAPP_PROVIDER_URL: ${WHATSAPP_PROVIDER_URL}
      WHATSAPP_PROVIDER_API_KEY: ${WHATSAPP_PROVIDER_API_KEY}
      WHATSAPP_OPENWA_SESSION: ${WHATSAPP_OPENWA_SESSION}
      WHATSAPP_PROVIDER_WEBHOOK_SECRET: ${WHATSAPP_PROVIDER_WEBHOOK_SECRET}
      # Auth / admin dashboard
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Business config
      BUSINESS_NAME: ${BUSINESS_NAME:-Arrocería Shanti}
      BUSINESS_PHONE: ${BUSINESS_PHONE}
      DELIVERY_FEE: ${DELIVERY_FEE:-3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - openwa-network

volumes:
  postgres_data:

networks:
  openwa-network:
    external: true
